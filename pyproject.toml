[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gruvbox-factory"
version = "2.0.0+mp.1"
description = "convert any image to the gruvbox pallete!"
authors = [{ name = "Paulo Pacitti", email = "ppacitti@outlook.com" }]
readme = "README.md"
requires-python = ">=3.13.1"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = [
    "gruvbox",
    "cli",
    "gruvbox-factory",
    "wallpaper",
    "image",
    "image-go-nord",
    "palette",
    "factory",
]
dependencies = [
    "certifi==2025.1.31",
    "charset-normalizer==3.4.1",
    "ffmpeg-python==0.2.0",
    "future==1.0.0",
    "idna==3.10",
    "image-go-nord==1.2.0",
    "markdown-it-py==3.0.0",
    "mdurl==0.1.2",
    "numpy==2.5.2",
    "pick==2.4.0",
    "pillow==12.3.0",
    "Pygments==2.19.1",
    "requests==2.32.3",
    "rich==13.9.4",
    "setuptools==75.8.0",
    "urllib3==2.3.0",
]

[project.urls]
"Homepage" = "https://github.com/paulopacitti/gruvbox-factory"
"Bug Tracker" = "https://github.com/paulopacitti/gruvbox-factory/issues"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
gruvbox-factory = "factory.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["factory"]

[tool.setuptools.package-data]
factory = ["gruvbox-white.txt", "gruvbox-pink.txt", "gruvbox-mix.txt"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TRY", "BLE", "RET", "PLR"]

[tool.ruff.lint.per-file-ignores]
# Both files are rewritten in part 2; these suppressions are deleted with them.
"factory/__main__.py" = ["PLR0912"]
"factory/video.py" = ["TRY300", "BLE001"]
# Comparing against a literal is what a test is for.
"tests/*" = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No -m default here on purpose. Every nix check names its marker explicitly,
# so a check can never pass by silently selecting nothing. The fast local
# default is a pytest alias in the devShell instead.
addopts = "-q -p no:cacheprovider"
markers = [
    "slow: builds a real 16 MiB LUT or converts the full-size example.png",
]
